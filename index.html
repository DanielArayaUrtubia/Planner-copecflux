<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Plans - Copec Flux</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f5eada">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5eada;
            color: #333;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* NAVBAR Y ENCABEZADO */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background-color: #f5eada;
            border-bottom: 1px solid #e0d0b8;
            height: 50px;
        }

        .logo-plans {
            font-weight: bold;
            color: #8b261d;
            font-size: 18px;
        }

        .logo-copec {
            font-weight: bold;
            color: #c82319;
            font-size: 16px;
            text-align: right;
        }
        .logo-copec span {
            display: block;
            font-size: 10px;
            color: #666;
        }

        /* BARRA DE HERRAMIENTAS */
        .toolbar {
            display: flex;
            gap: 5px;
            padding: 5px 10px;
            background-color: #e2d1b9;
            overflow-x: auto;
            white-space: nowrap;
            height: 45px;
            align-items: center;
        }

        .tool-btn {
            padding: 6px 12px;
            border: 1px solid #c8b59e;
            background-color: #eee1cc;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .tool-btn.active {
            background-color: #a2c4e2;
            border-color: #6b9bc3;
            color: #1a4971;
        }

        /* LAYOUT PRINCIPAL Y CONTENEDOR */
        .app-container {
            display: flex;
            height: calc(100vh - 95px);
            width: 100vw;
            position: relative;
        }

        .canvas-container {
            flex: 1;
            position: relative;
            background-color: #f5edd6;
            background-image: 
                linear-gradient(#e6dabf 1px, transparent 1px),
                linear-gradient(90deg, #e6dabf 1px, transparent 1px);
            background-size: 20px 20px;
            overflow: hidden;
        }

        canvas {
            display: block;
            touch-action: none;
        }

        .sidebar {
            width: 300px;
            background-color: #e2d1b9;
            border-left: 1px solid #c8b59e;
            padding: 10px;
            overflow-y: auto;
            transition: transform 0.3s ease;
        }

        /* AJUSTES RESPONSIVE PARA MÓVILES (APK / CHROME MOBILE) */
        @media screen and (max-width: 768px) {
            .app-container {
                flex-direction: column !important; /* Fuerza diseño vertical en móviles */
            }

            .sidebar {
                width: 100% !important;
                height: 40% !important;
                border-left: none;
                border-top: 2px solid #c8b59e;
                position: absolute;
                bottom: 0;
                left: 0;
                background-color: #e8d9c4;
                z-index: 10;
            }

            .canvas-container {
                height: 100% !important;
                width: 100% !important;
            }
        }

        /* Ocultar input de archivo original */
        #input-foto {
            display: none;
        }

        /* BARRA INFERIOR DE ESTADO */
        .footer-status {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(245, 234, 218, 0.9);
            padding: 5px 10px;
            font-size: 11px;
            color: #555;
            text-align: center;
            border-top: 1px solid #e0d0b8;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo-plans">Plans</div>
        <div class="logo-copec">COPEC <span>FLUX</span></div>
    </div>

    <div class="toolbar">
        <button class="tool-btn active" id="btn-linea">— Línea</button>
        <button class="tool-btn" id="btn-polilinea">⤾ Polilínea</button>
        <button class="tool-btn" id="btn-seleccionar">🖰 Seleccionar</button>
        <button class="tool-btn" id="btn-inclinacion">∡ Inclinación</button>
        <!-- BOTÓN PARA CARGAR FOTOGRAFÍAS -->
        <button class="tool-btn" onclick="document.getElementById('input-foto').click()">📷 Cargar Foto</button>
    </div>

    <!-- Input de imagen optimizado con capture="environment" para abrir la cámara directo o galería -->
    <input type="file" id="input-foto" accept="image/*">

    <div class="app-container">
        <div class="canvas-container" id="canvas-wrapper">
            <canvas id="main-canvas"></canvas>
        </div>

        <div class="sidebar" id="sidebar-panel">
            <h3>Elementos (0)</h3>
            <p style="margin-top: 20px; text-align: center; color: #776a5b;">
                Dibuja una línea, coloca un componente o carga una fotografía de fondo.
            </p>
        </div>
    </div>

    <div class="footer-status">
        Clic para iniciar · Doble clic para cerrar polilínea · Selecciona línea y activa "Editar pts"
    </div>

    <script>
        // Registrar Service Worker para PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('SW error:', err));
            });
        }

        // Configuración de Canvas Adaptativo
        const canvas = document.getElementById('main-canvas');
        const ctx = canvas.getContext('2d');
        const wrapper = document.getElementById('canvas-wrapper');
        let bgImage = null;

        function resizeCanvas() {
            canvas.width = wrapper.clientWidth;
            canvas.height = wrapper.clientHeight;
            render();
        }

        window.addEventListener('resize', resizeCanvas);

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Si hay una imagen cargada, dibujarla ajustada en el canvas
            if (bgImage) {
                const hRatio = canvas.width / bgImage.width;
                const vRatio = canvas.height / bgImage.height;
                const ratio = Math.min(hRatio, vRatio);
                const centerShift_x = (canvas.width - bgImage.width * ratio) / 2;
                const centerShift_y = (canvas.height - bgImage.height * ratio) / 2;
                
                ctx.drawImage(bgImage, 0, 0, bgImage.width, bgImage.height,
                    centerShift_x, centerShift_y, bgImage.width * ratio, bgImage.height * ratio);
            }
        }

        // LÓGICA OPTIMIZADA PARA PROCESAR FOTOGRAFÍAS DESDE MÓVIL
        document.getElementById('input-foto').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    // Redimensionamiento seguro a Máx 1280px para no saturar memoria en APKs
                    const maxDim = 1280;
                    let width = img.width;
                    let height = img.height;

                    if (width > maxDim || height > maxDim) {
                        if (width > height) {
                            height = Math.round((height * maxDim) / width);
                            width = maxDim;
                        } else {
                            width = Math.round((width * maxDim) / height);
                            height = maxDim;
                        }
                    }

                    const tempCanvas = document.createElement('canvas');
                    tempCanvas.width = width;
                    tempCanvas.height = height;
                    const tempCtx = tempCanvas.getContext('2d');
                    tempCtx.drawImage(img, 0, 0, width, height);

                    // Asignar imagen optimizada
                    bgImage = new Image();
                    bgImage.onload = () => render();
                    bgImage.src = tempCanvas.toDataURL('image/jpeg', 0.85);
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        // Inicializar tamaño del Canvas
        setTimeout(resizeCanvas, 100);
    </script>
</body>
</html>
